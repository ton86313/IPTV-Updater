name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Checkout IPTV-Updater repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4 requests

      - name: Run updater script
        run: python update_playlist.py

      - name: Checkout target repository (IPTV-Marco with Sparse Checkout)
        uses: actions/checkout@v4
        with:
          repository: 'ton86313/IPTV-Marco'
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          path: 'target_repo'
          sparse-checkout: |
            IPTV-Marco.m3u

      - name: Copy generated file and push to IPTV-Marco
        run: |
          if [ -f IPTV-Marco.m3u ]; then
            cp IPTV-Marco.m3u target_repo/IPTV-Marco.m3u
            cd target_repo
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add IPTV-Marco.m3u
            git commit -m "Auto-update IPTV-Marco.m3u link from IPTV-Updater" || echo "No changes to commit"
            git push origin main
            echo "✅ Push ไฟล์ไปที่ ton86313/IPTV-Marco สำเร็จแล้ว!"
          else
            echo "⚠️ ไม่พบไฟล์ IPTV-Marco.m3u ข้ามการ Push"
            exit 0
          fi
