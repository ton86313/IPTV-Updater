name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 1  # ป้องกันไม่ให้ค้างเกิน 1 นาที
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run updater script
        run: python update_playlist.py

      - name: Commit and push safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          if [ -f IPTV-Marco.m3u ]; then
            git add IPTV-Marco.m3u
            git commit -m "Auto-update IPTV-Marco.m3u link" || echo "No changes to commit"
            git push origin HEAD
          else
            echo "⚠️ ไม่พบไฟล์ IPTV-Marco.m3u ข้ามการ Push"
            exit 0
          fi
